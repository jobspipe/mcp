name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in via DNS domain auth (dev.jobspipe namespace)
        run: ./mcp-publisher login dns --domain jobspipe.dev --private-key "${SEED}"
        env:
          SEED: ${{ secrets.MCP_REGISTRY_DNS_SEED }}

      - name: Publish server.json
        run: ./mcp-publisher publish
