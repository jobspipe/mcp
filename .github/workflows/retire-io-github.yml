name: Retire io.github registry entry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Mark io.github.jobspipe/mcp deleted
        run: echo y | ./mcp-publisher status --status deleted --message "Renamed to dev.jobspipe/mcp (domain-verified namespace)" --all-versions io.github.jobspipe/mcp
